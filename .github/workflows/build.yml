# Build on every push / pull request; a tag v* publishes a release with FTVIEW.WMF.
name: build
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools (SDCC 4.4.0 binary of sdcc.sourceforge.net, dosfstools, mtools, python venv)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dosfstools mtools
          curl -sSL -o sdcc.tar.bz2 https://sourceforge.net/projects/sdcc/files/sdcc-linux-amd64/4.4.0/sdcc-4.4.0-amd64-unknown-linux2.5.tar.bz2/download
          echo "488a81eb8d762d2754d4e3fac83d202d  sdcc.tar.bz2" | md5sum -c
          mkdir -p ~/.local/opt && tar xjf sdcc.tar.bz2 -C ~/.local/opt
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
      - name: Build
        run: make -B
      - name: The committed FTVIEW.WMF is the build of this commit
        run: git diff --exit-code FTVIEW.WMF
      - name: Test
        run: make test
      - name: Board check plugin
        run: make diag
      - uses: actions/upload-artifact@v4
        with:
          name: FTVIEW.WMF
          path: FTVIEW.WMF
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" FTVIEW.WMF --title "FTVIEW.WMF ${GITHUB_REF_NAME#v}" --generate-notes
