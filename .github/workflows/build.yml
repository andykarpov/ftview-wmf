# Build on every push / pull request; a tag v* publishes a release with FTVIEW.WMF
# and the ftconv binaries (PyInstaller, Linux / Windows / macOS).
name: build
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools (SDCC 4.4.0 binary of sdcc.sourceforge.net, dosfstools, mtools, ffmpeg, python venv)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dosfstools mtools ffmpeg
          curl -sSL -o sdcc.tar.bz2 https://sourceforge.net/projects/sdcc/files/sdcc-linux-amd64/4.4.0/sdcc-4.4.0-amd64-unknown-linux2.5.tar.bz2/download
          echo "488a81eb8d762d2754d4e3fac83d202d  sdcc.tar.bz2" | md5sum -c
          mkdir -p ~/.local/opt && tar xjf sdcc.tar.bz2 -C ~/.local/opt
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
      - name: Build
        run: make -B
      - name: The committed FTVIEW.WMF is the build of this commit
        run: git diff --exit-code FTVIEW.WMF
      - name: Test
        run: make test
      - name: Board check plugin
        run: make diag
      - uses: actions/upload-artifact@v4
        with:
          name: FTVIEW.WMF
          path: FTVIEW.WMF
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" FTVIEW.WMF --title "FTVIEW.WMF ${GITHUB_REF_NAME#v}" --generate-notes

  # tools/ftconv.py as one file per platform (no ffmpeg inside: the user installs
  # it); each binary converts a lavfi clip and checks the result before upload.
  ftconv:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FFmpeg for the smoke test
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
      - name: Build
        run: |
          python -m pip install -q pyinstaller
          pyinstaller --onefile --name ftconv --distpath dist tools/ftconv.py
      - name: Smoke test
        run: |
          exe=dist/ftconv; [ "$RUNNER_OS" = Windows ] && exe=dist/ftconv.exe
          ffmpeg -v error -y -f lavfi -i testsrc2=size=1280x720:rate=25:duration=3 \
            -f lavfi -i sine=duration=3 -c:v libx264 -pix_fmt yuv420p -c:a aac clip.mp4
          "$exe" --no-pause -o gs.avi clip.mp4
          "$exe" --no-pause --audio esp -o esp.avi clip.mp4
          "$exe" --no-pause --check gs.avi esp.avi | tee check.txt
          grep -c "plays frame by frame" check.txt | grep -qx 2
          grep -q FTVIEWI1 check.txt
      - name: Pack
        run: |
          mkdir pkg
          if [ "$RUNNER_OS" = Windows ]; then
            cp dist/ftconv.exe pkg/ && (cd pkg && 7z a -bd ../ftconv-${{ matrix.name }}.zip ftconv.exe)
          else
            cp dist/ftconv pkg/ && tar czf ftconv-${{ matrix.name }}.tar.gz -C pkg ftconv
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ftconv-${{ matrix.name }}
          path: ftconv-${{ matrix.name }}.*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ftconv-${{ matrix.name }}.* --clobber
